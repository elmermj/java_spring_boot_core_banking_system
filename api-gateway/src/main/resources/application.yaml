spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/auth/**
        - id: account-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/account/**
        - id: notification-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/notifications/**
        - id: transaction-orchestrator
          uri: http://localhost:8081
          predicates:
            - Path=/api/transactions/**

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-characters}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:20}