spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/jsb_cbs_unified?currentSchema=notification_service
    username: jsb
    password: jsb

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification_service

  flyway:
    enabled: true
    schemas: notification_service
    default-schema: notification_service

server:
  port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  push:
    fcm:
      enabled: ${FCM_ENABLED:false}
      service-account-key: ${FCM_SERVICE_ACCOUNT_KEY_PATH:}
    apns:
      enabled: ${APNS_ENABLED:false}
      # Token-based authentication (.p8 key file) - Recommended by Apple
      p8-key-path: ${APNS_P8_KEY_PATH:}
      team-id: ${APNS_TEAM_ID:}
      key-id: ${APNS_KEY_ID:}
      bundle-id: ${APNS_BUNDLE_ID:}
      production: ${APNS_PRODUCTION:false}
      connection-timeout-seconds: 10
    retry:
      max-attempts: ${PUSH_RETRY_MAX_ATTEMPTS:3}
      initial-delay-ms: ${PUSH_RETRY_INITIAL_DELAY_MS:1000}
      max-delay-ms: ${PUSH_RETRY_MAX_DELAY_MS:30000}
      backoff-multiplier: ${PUSH_RETRY_BACKOFF_MULTIPLIER:2.0}
